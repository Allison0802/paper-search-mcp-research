[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-search-mcp-research"
version = "0.2.0"
authors = [{ name = "P.S Zhang" }]
maintainers = [{ name = "Hongye (Chris) Yang" }]
description = "A research-oriented MCP server for reproducible academic-literature retrieval and open-access-first full-text resolution."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "mcp",
    "academic",
    "papers",
    "search",
    "arxiv",
    "pubmed",
    "semantic-scholar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests",
    "feedparser",
    "fastmcp",
    "pypdf",
    "mcp[cli]>=1.6.0,<2",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "httpx[socks]>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/Allison0802/paper-search-mcp-research"
Repository = "https://github.com/Allison0802/paper-search-mcp-research"
Issues = "https://github.com/Allison0802/paper-search-mcp-research/issues"

[project.scripts]
paper-search-mcp = "paper_search_mcp.server:main"
paper-search = "paper_search_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["paper_search_mcp"]
